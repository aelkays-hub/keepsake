[package]
name = "keepsake-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
keepsake-core = { path = "../keepsake-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
keyring.workspace = true

# keyring (ADR-036) keeps the Claude API key in the OS store. Otherwise no
# OS binding crates: Windows (cfgmgr32, kernel32) and macOS
# (DiskArbitration, CoreFoundation) are called through hand-written
# declarations in src/windows.rs and src/macos.rs (ADR-020).

[dev-dependencies]
tempfile.workspace = true
