[package]
name = "keepsake-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "keepsake_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "keepsake-app"
path = "src/main.rs"

[dependencies]
keepsake-core = { path = "../../../crates/keepsake-core" }
keepsake-platform = { path = "../../../crates/keepsake-platform" }
tauri = { version = "2", features = ["protocol-asset"] }
# Native folder picker (ADR-022).
tauri-plugin-dialog = "2"
# TypeScript types for the command API, generated into ../src/bindings (ADR-022).
ts-rs = "12"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
