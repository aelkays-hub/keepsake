name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MIRROR: https://github.com/aelkays-hub/keepsake/releases/download/vendor-binaries-v1

# ──────────────────────────────────────────────────────────────────────────────
# Reusable steps are inlined because GitHub Actions doesn't support YAML anchors.
# The vendor-download block appears twice (x64 and ARM64) — keep them in sync.
# ──────────────────────────────────────────────────────────────────────────────

jobs:

  # ── Windows x64 installer ────────────────────────────────────────────────────
  build-win-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release-win-x64

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install UI dependencies
        working-directory: app/ui
        run: pnpm install --frozen-lockfile

      # FFmpeg, ExifTool and LibRaw, pinned by SHA-256 (same as dev and CI).
      - name: Download vendor binaries — x64
        shell: pwsh
        run: ./scripts/setup.ps1 -VendorOnly -Arch AMD64

      - name: Build Tauri installer — x64
        working-directory: app/ui
        run: pnpm tauri build --bundles msi,nsis

      - name: Sign installers (skip if no certificate)
        if: env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath  = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          $signtool  = "C:\Program Files (x86)\Windows Kits\10\bin\x64\signtool.exe"
          foreach ($f in (Get-ChildItem target\release\bundle -Recurse -Include *.msi,*-setup.exe)) {
            & $signtool sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              /t http://timestamp.digicert.com /fd sha256 $f.FullName
            if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed on $($f.Name)"; exit 1 }
          }
          Remove-Item $certPath -Force

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: installer-win-x64-msi
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload NSIS
        uses: actions/upload-artifact@v4
        with:
          name: installer-win-x64-nsis
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Upload CLI (for smoke test)
        uses: actions/upload-artifact@v4
        with:
          name: cli-win-x64
          path: target/release/keepsake.exe
          if-no-files-found: error

  # ── Windows ARM64 installer (cross-compiled from x64 runner) ─────────────────
  build-win-arm64:
    name: Windows ARM64 (cross)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable + ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release-win-arm64

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install UI dependencies
        working-directory: app/ui
        run: pnpm install --frozen-lockfile

      # ARM64 FFmpeg; ExifTool is Perl; LibRaw's x64 build runs emulated.
      - name: Download vendor binaries — ARM64
        shell: pwsh
        run: ./scripts/setup.ps1 -VendorOnly -Arch ARM64

      - name: Build Tauri installer — ARM64 cross
        working-directory: app/ui
        run: pnpm tauri build --target aarch64-pc-windows-msvc --bundles msi,nsis

      - name: Sign installers (skip if no certificate)
        if: env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath  = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          $signtool  = "C:\Program Files (x86)\Windows Kits\10\bin\x64\signtool.exe"
          $bundleDir = "target\aarch64-pc-windows-msvc\release\bundle"
          foreach ($f in (Get-ChildItem $bundleDir -Recurse -Include *.msi,*-setup.exe)) {
            & $signtool sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              /t http://timestamp.digicert.com /fd sha256 $f.FullName
            if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed on $($f.Name)"; exit 1 }
          }
          Remove-Item $certPath -Force

      - name: Upload MSI (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: installer-win-arm64-msi
          path: target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload NSIS (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: installer-win-arm64-nsis
          path: target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  # ── macOS Apple Silicon DMG ───────────────────────────────────────────────────
  # DEFERRED — pending LGPL macOS FFmpeg binary (see ADR-005).
  # Uncomment this job once the macOS FFmpeg build is available at the mirror.
