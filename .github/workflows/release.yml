  # ── Smoke test: install x64 MSI headlessly, run CLI checks ───────────────────
  smoke-test-win:
    name: Smoke test — Windows x64
    needs: build-win-x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download x64 MSI
        uses: actions/download-artifact@v4
        with:
          name: installer-win-x64-msi
          path: artifacts/msi

      - name: Download CLI binary
        uses: actions/download-artifact@v4
        with:
          name: cli-win-x64
          path: artifacts/cli

      - name: Install MSI silently
        shell: pwsh
        run: |
          $msi = (Get-ChildItem artifacts\msi -Filter *.msi | Select-Object -First 1).FullName
          Write-Host "Installing: $msi"
          $log = "$env:RUNNER_TEMP\install.log"
          $p   = Start-Process msiexec.exe `
                   -ArgumentList "/i `"$msi`" /quiet /norestart /l*v `"$log`"" `
                   -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Host "--- last 50 lines of install log ---"
            Get-Content $log -Tail 50 -ErrorAction SilentlyContinue
            Write-Error "MSI install failed (exit $($p.ExitCode))"
          }
          Write-Host "OK: MSI installed (exit 0)"

      - name: Verify installed files
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files\Keepsake\keepsake-app.exe",
            "C:\Program Files (x86)\Keepsake\keepsake-app.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            Write-Error "keepsake-app.exe not found in expected install locations"
          }
          Write-Host "OK: installed at $found"
          # Verify sidecars are present
          $dir = Split-Path $found
          foreach ($f in @("ffmpeg\ffmpeg.exe", "exiftool\exiftool.exe")) {
            if (-not (Test-Path (Join-Path $dir $f))) {
              Write-Error "Expected sidecar missing: $f"
            }
          }
          Write-Host "OK: FFmpeg and ExifTool sidecars present"

      - name: CLI smoke — keepsake --version
        shell: pwsh
        run: |
          $cli = "artifacts\cli\keepsake.exe"
          $out = & $cli --version 2>&1
          Write-Host "Output: $out"
          if ($LASTEXITCODE -ne 0) { Write-Error "--version exited $LASTEXITCODE" }
          if ($out -notmatch "keepsake") { Write-Error "Unexpected version output: $out" }
          Write-Host "OK"

      - name: CLI smoke — corpus scan fixtures
        shell: pwsh
        run: |
          $cli = "artifacts\cli\keepsake.exe"
          & $cli corpus scan tests/fixtures/
          if ($LASTEXITCODE -ne 0) { Write-Error "corpus scan exited $LASTEXITCODE" }
          Write-Host "OK: corpus scan completed successfully"

  # ── Create GitHub Release ──────────────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: [build-win-x64, build-win-arm64, smoke-test-win]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets

      - name: List release assets
        run: ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## Keepsake ${{ github.ref_name }}

            ### Signing status

            | Platform | Status |
            |---|---|
            | Windows x64  | ⚠️ Unsigned — add `WINDOWS_CERTIFICATE` + `WINDOWS_CERTIFICATE_PASSWORD` repo secrets to enable signing |
            | Windows ARM64 | ⚠️ Unsigned — same secrets as above |
            | macOS Apple Silicon | Not yet available — see [ADR-005](docs/DECISIONS.md) |

            If Windows shows a SmartScreen warning, click **More info → Run anyway**.
            The installers bundle FFmpeg (LGPL) and ExifTool — no separate download needed.
