name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MIRROR: https://github.com/aelkays-hub/keepsake/releases/download/vendor-binaries-v1

# ──────────────────────────────────────────────────────────────────────────────
# Reusable steps are inlined because GitHub Actions doesn't support YAML anchors.
# The vendor-download block appears twice (x64 and ARM64) — keep them in sync.
# ──────────────────────────────────────────────────────────────────────────────

jobs:

  # ── Windows x64 installer ────────────────────────────────────────────────────
  build-win-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release-win-x64

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install UI dependencies
        working-directory: app/ui
        run: pnpm install --frozen-lockfile

      - name: Download vendor binaries — x64 FFmpeg + ExifTool
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          New-Item -ItemType Directory -Force vendor\exiftool | Out-Null

          # FFmpeg x64
          $zip = "vendor\ffmpeg-win64.zip"
          Invoke-WebRequest "$env:MIRROR/ffmpeg-n9.0-latest-win64-lgpl-9.0.zip" -OutFile $zip -UseBasicParsing
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          $want = "73950cc6d7548c08d435bfb9c65b60798b6cd59647e59bb41e9af3876c90ebef"
          if ($hash -ne $want) { Write-Error "FFmpeg x64 SHA-256 mismatch: got $hash"; exit 1 }
          $ext = "vendor\ffmpeg-ext"
          Expand-Archive $zip $ext -Force
          $bin = (Get-ChildItem $ext -Directory | Select-Object -First 1).FullName + "\bin"
          Copy-Item "$bin\ffmpeg.exe"  vendor\ffmpeg.exe
          Copy-Item "$bin\ffprobe.exe" vendor\ffprobe.exe
          Remove-Item $ext -Recurse -Force
          Remove-Item $zip -Force

          # ExifTool
          $zip = "vendor\exiftool.zip"
          Invoke-WebRequest "$env:MIRROR/exiftool-13.59_64.zip" -OutFile $zip -UseBasicParsing
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          $want = "44b512b25af500724ba579d0a53c8fc5851628b692dd5e5d94ae4a15c2cba9ec"
          if ($hash -ne $want) { Write-Error "ExifTool SHA-256 mismatch: got $hash"; exit 1 }
          $ext = "vendor\et-ext"
          Expand-Archive $zip $ext -Force
          $exe = Get-ChildItem $ext -Recurse -Filter "exiftool*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName vendor\exiftool\exiftool.exe
          Copy-Item (Join-Path $exe.DirectoryName "exiftool_files") vendor\exiftool -Recurse -Force
          Remove-Item $ext -Recurse -Force
          Remove-Item $zip -Force

      - name: Build Tauri installer — x64
        working-directory: app/ui
        run: pnpm tauri build --bundles msi,nsis

      - name: Sign installers (skip if no certificate)
        if: env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath  = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          $signtool  = "C:\Program Files (x86)\Windows Kits\10\bin\x64\signtool.exe"
          foreach ($f in (Get-ChildItem target\release\bundle -Recurse -Include *.msi,*-setup.exe)) {
            & $signtool sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              /t http://timestamp.digicert.com /fd sha256 $f.FullName
            if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed on $($f.Name)"; exit 1 }
          }
          Remove-Item $certPath -Force

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: installer-win-x64-msi
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload NSIS
        uses: actions/upload-artifact@v4
        with:
          name: installer-win-x64-nsis
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Upload CLI (for smoke test)
        uses: actions/upload-artifact@v4
        with:
          name: cli-win-x64
          path: target/release/keepsake.exe
          if-no-files-found: error

  # ── Windows ARM64 installer (cross-compiled from x64 runner) ─────────────────
  build-win-arm64:
    name: Windows ARM64 (cross)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable + ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release-win-arm64

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install UI dependencies
        working-directory: app/ui
        run: pnpm install --frozen-lockfile

      - name: Download vendor binaries — ARM64 FFmpeg + ExifTool
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          New-Item -ItemType Directory -Force vendor\exiftool | Out-Null

          # FFmpeg ARM64 (bundled into the ARM64 installer so it runs on ARM64 machines)
          $zip = "vendor\ffmpeg-arm64.zip"
          Invoke-WebRequest "$env:MIRROR/ffmpeg-n9.0-latest-winarm64-lgpl-9.0.zip" -OutFile $zip -UseBasicParsing
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          $want = "33cb51e1529c1d658eb814c0cd557272f35a83951d7bb8009ac6bbe7854b0cc6"
          if ($hash -ne $want) { Write-Error "FFmpeg ARM64 SHA-256 mismatch: got $hash"; exit 1 }
          $ext = "vendor\ffmpeg-ext"
          Expand-Archive $zip $ext -Force
          $bin = (Get-ChildItem $ext -Directory | Select-Object -First 1).FullName + "\bin"
          Copy-Item "$bin\ffmpeg.exe"  vendor\ffmpeg.exe
          Copy-Item "$bin\ffprobe.exe" vendor\ffprobe.exe
          Remove-Item $ext -Recurse -Force
          Remove-Item $zip -Force

          # ExifTool (same binary for both arches — Windows x64 Perl exe)
          $zip = "vendor\exiftool.zip"
          Invoke-WebRequest "$env:MIRROR/exiftool-13.59_64.zip" -OutFile $zip -UseBasicParsing
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          $want = "44b512b25af500724ba579d0a53c8fc5851628b692dd5e5d94ae4a15c2cba9ec"
          if ($hash -ne $want) { Write-Error "ExifTool SHA-256 mismatch: got $hash"; exit 1 }
          $ext = "vendor\et-ext"
          Expand-Archive $zip $ext -Force
          $exe = Get-ChildItem $ext -Recurse -Filter "exiftool*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName vendor\exiftool\exiftool.exe
          Copy-Item (Join-Path $exe.DirectoryName "exiftool_files") vendor\exiftool -Recurse -Force
          Remove-Item $ext -Recurse -Force
          Remove-Item $zip -Force

      - name: Build Tauri installer — ARM64 cross
        working-directory: app/ui
        run: pnpm tauri build --target aarch64-pc-windows-msvc --bundles msi,nsis

      - name: Sign installers (skip if no certificate)
        if: env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath  = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          $signtool  = "C:\Program Files (x86)\Windows Kits\10\bin\x64\signtool.exe"
          $bundleDir = "target\aarch64-pc-windows-msvc\release\bundle"
          foreach ($f in (Get-ChildItem $bundleDir -Recurse -Include *.msi,*-setup.exe)) {
            & $signtool sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              /t http://timestamp.digicert.com /fd sha256 $f.FullName
            if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed on $($f.Name)"; exit 1 }
          }
          Remove-Item $certPath -Force

      - name: Upload MSI (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: installer-win-arm64-msi
          path: target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload NSIS (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: installer-win-arm64-nsis
          path: target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  # ── macOS Apple Silicon DMG ───────────────────────────────────────────────────
  # DEFERRED — pending LGPL macOS FFmpeg binary (see ADR-005).
